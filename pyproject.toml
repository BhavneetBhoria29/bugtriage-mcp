[project]
name = "bugtriage-mcp"
version = "0.1.0"
description = "ML-backed bug triage and log search for an automotive connectivity ECU, exposed as MCP tools"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.10,<2",
  "scikit-learn>=1.3",
  "rank-bm25>=0.2.2",
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7", "grpcio>=1.84", "protobuf>=7.35", "grpcio-tools>=1.84"]
# generated stubs in src/bugtriage_mcp/v1 need these runtime floors
grpc = ["grpcio>=1.84", "protobuf>=7.35"]
wandb = ["wandb>=0.19"]

[project.scripts]
bugtriage-mcp = "bugtriage_mcp.server:main"
bugtriage-grpc = "bugtriage_mcp.grpc_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
